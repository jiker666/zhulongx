  # Prepend these directories to PATH inside the sandbox so python3 resolves to
  # the conda/miniforge environment where angr, unicorn, z3, pwntools, capstone live.
  extraPaths:
    - /Users/j1k3r/miniforge3/bin
    - /opt/homebrew/bin
  # Read-only paths that sandbox commands may reference (e.g. wordlists for flask-unsign, hydra, etc.)
  readOnlyPaths:
    - /Users/j1k3r/wordlists
    - /opt/homebrew/share/john
    - /etc
    - /usr/share
    - /opt/homebrew/share

server:
  host: 127.0.0.1
  port: 7318
  tokenEnv: XUANSHU_SERVER_TOKEN

webReasoning:
  enabled: true
  autoDetectWebTasks: true
  persistState: true
  enableHypothesisManagement: true
  enableReflection: true
  enableActionDeduplication: true
  noEvidenceRoundLimit: 3
  duplicateActionLimit: 2
  toolFailureLimit: 3
  finalizationRoundReserve: 3
  maxObservations: 80
  maxHypotheses: 40
  maxActions: 320
  maxReflections: 12

browser:
  enabled: true
  headless: true
  maxSessionsPerRun: 1
  maxPagesPerSession: 2
  maxNavigationsPerRun: 12
  maxActionsPerRun: 50
  maxNetworkEventsPerRun: 500
  maxDomElementsPerSnapshot: 200
  maxDomSnapshotsPerRun: 40
  maxScreenshotsPerRun: 12
  maxResponseBodyBytes: 65536
  maxScriptBytes: 131072
  navigationTimeoutMs: 15000
  actionTimeoutMs: 10000
  sessionTimeoutMs: 900000
  # CTF work often needs upload/download (file upload vulns, dynamic artifacts).
  # Popups and external protocols stay blocked for safety.
  blockDownloads: false
  blockUploads: false
  blockPopups: true
  blockExternalProtocols: true
