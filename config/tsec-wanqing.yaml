# TSecBench local run with Wanqing internal model.
# Requires: WQ_API_KEY, BENCHMARK_TOKEN, BENCHMARK_BASE_URL in environment.
# VPN is expected to already be up; set TSEC_SKIP_VPN=1 to bypass health check.
model:
  provider: wanqing-internal
  id: ep-spmlx5-1786072758181058776
  name: Wanqing ep-spmlx5
  api: openai-completions
  baseUrl: https://wanqing-api.corp.kuaishou.com/api/gateway/v1/endpoints
  apiKeyEnv: WQ_API_KEY
  reasoning: true
  contextWindow: 1048576
  maxTokens: 16384

runtime:
  # low thinking = faster token generation, still sufficient for Web/pwn/re challenges.
  thinkingLevel: low
  artifactRoot: .xuan-shu/runs
  scratchRoot: .xuan-shu/work
  maxTurns: 120
  maxToolCalls: 1500
  # 45 min per challenge — gives hard sandbox/RE/binary tasks enough runway.
  maxRuntimeMs: 2700000
  # Single-instance throughput: one agent at a time avoids shared TPM exhaustion.
  # modelMinIntervalMs controls the intra-run gap; inter-run gap is enforced by
  # the batch script which serialises runs (CONCURRENCY=1 by default).
  modelMinIntervalMs: 3000
  modelRequestsPerMinute: 60
  modelTokensPerMinute: 600000
  # Allow up to 5 min of back-off when a 429 retry-after is not specified.
  modelMaxRetryDelayMs: 300000
  maxActionsWithoutCheckpoint: 1000
  maxRepeatedAction: 1000
  # Permissive policy: skip flow-control gates (checkpoint/repeat limits) and let
  # the sandbox do read-wide path permitting. Budgets below still apply.
  policyPermissive: true
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 32
  maxScratchFileBytes: 2097152
  # finalization reserve: keep small so agents can finish right up to the last seconds.
  finalizationReserveMs: 15000
  commandTimeoutMs: 120000
  httpTimeoutMs: 15000
  maxHttpRequests: 2000
  maxTcpSessions: 32
  maxTcpBytes: 4194304
  sandbox:
    socketPath: tcp://127.0.0.1:7320
    connectTimeoutMs: 3000

