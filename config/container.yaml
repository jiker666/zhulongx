model:
  provider: anthropic
  id: glm-5.3
  name: GLM 5.3
  baseUrl: https://open.bigmodel.cn/api/anthropic
  apiKeyEnv: XUANSHU_MODEL_API_KEY
  # R25 multi-account key pool (10h finals): hosted-entrypoint fills
  # XUANSHU_MODEL_API_KEYS with the comma-joined GLM coding-plan keys from
  # the panel's BIGMODEL_API_KEY / BIGMODEL_API_KEY_2. The gateway
  # round-robins the pool and rotates on quota exhaustion before the
  # self-funded DPSK rescue is touched; unset = single-key behaviour.
  apiKeyPoolEnv: XUANSHU_MODEL_API_KEYS
  reasoning: true
  contextWindow: 400000
  # Rescue model (no-hint finals): transparent gateway failover when GLM
  # errors or is rate-limited, plus per-run rescue dispatch (POST /v1/runs
  # {"modelRole":"fallback"}). Inert until XUANSHU_FALLBACK_API_KEY is set.
  fallback:
    provider: anthropic
    id: dpsk-4.1
    name: DPSK 4.1
    baseUrl: https://api.deepseek.com/anthropic
    apiKeyEnv: XUANSHU_FALLBACK_API_KEY
    reasoning: true
    contextWindow: 128000
runtime:
  thinkingLevel: high
  artifactRoot: /data/runs
  scratchRoot: /workspace/work
  maxTurns: 30
  maxToolCalls: 80
  maxRuntimeMs: 900000
  # R7 (bctf top-6 post-mortem): token throughput tracks rank — the #1 agent
  # burned ~1.4B tokens; our 4-lane single-stream runs could not even reach
  # the old 48 RPM / 480K TPM gate. Competition-tier scaling (operator info
  # 2026-10-16): the GLM gateway accepts ~100 concurrent connections at
  # competition time — the min interval drops 5000ms (12 starts/min global,
  # the real ceiling) to 500ms (120/min), RPM 54→120, TPM 540K→1M. The
  # DeepSeek fast server derives from this file but restores the proven
  # conservative gates (hosted-entrypoint seds them back) — its concurrency
  # budget is unknown; GLM is the one with headroom.
  modelMinIntervalMs: 500
  modelRequestsPerMinute: 120
  modelTokensPerMinute: 1000000
  maxActionsWithoutCheckpoint: 4
  maxRepeatedAction: 2
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 8
  maxScratchFileBytes: 1048576
  finalizationReserveMs: 90000
  # R10: 30s silently truncated decompiles/scans (nuclei/apktool); 300s
  # matches observed per-command needs, run budget still bounds the total.
  commandTimeoutMs: 300000
  httpTimeoutMs: 15000
  maxHttpRequests: 40
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: /run/xuanshu/ctf-sandbox.sock
    connectTimeoutMs: 2000

