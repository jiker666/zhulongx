model:
  provider: anthropic
  id: glm-5.3
  name: GLM 5.3
  baseUrl: https://open.bigmodel.cn/api/anthropic
  apiKeyEnv: XUANSHU_MODEL_API_KEY
  reasoning: true
  contextWindow: 400000

runtime:
  thinkingLevel: high
  artifactRoot: /data/runs
  scratchRoot: /workspace/work
  maxTurns: 30
  maxToolCalls: 80
  maxRuntimeMs: 900000
  # Effective budget leaves 20% headroom under a 60 RPM / 600K TPM provider quota.
  modelMinIntervalMs: 7500
  modelRequestsPerMinute: 48
  modelTokensPerMinute: 480000
  maxActionsWithoutCheckpoint: 4
  maxRepeatedAction: 2
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 8
  maxScratchFileBytes: 1048576
  finalizationReserveMs: 90000
  commandTimeoutMs: 30000
  httpTimeoutMs: 15000
  maxHttpRequests: 40
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: /run/xuanshu/ctf-sandbox.sock
    connectTimeoutMs: 2000

scope:
  mode: observe
  workspaceRoot: /workspace/input
  allowedHosts: []
  allowedPrograms:
    - 7z
    - apktool
    - base32
    - base64
    - bc
    - binwalk
    - bzip2
    - checksec
    - convert
    - curl
    - dcfldd
    - dig
    - ecm
    - dirsearch
    - exiftool
    - factor
    - ffmpeg
    - ffprobe
    - file
    - ffuf
    - find
    - fls
    - flask-unsign
    - foremost
    - fsstat
    - g++
    - gap
    - gcc
    - gdb
    - gifsicle
    - gp
    - gzip
    - gobuster
    - hashcat
    - icat
    - identify
    - java
    - john
    - jq
    - make
    - minimodem
    - mmls
    - multimon-ng
    - nmap
    - nm
    - objdump
    - one_gadget
    - outguess
    - openssl
    - patchelf
    - pickora
    - pngcheck
    - python3
    - qemu-aarch64
    - qemu-arm
    - qemu-i386
    - qemu-x86_64
    - qrencode
    - ropper
    - ROPgadget
    - RsaCtfTool
    - r2
    - sage
    - readelf
    - rg
    - seccomp-tools
    - scalpel
    - sox
    - soxi
    - sqlmap
    - sqlite3
    - steghide
