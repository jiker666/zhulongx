model:
  provider: wanqing-corp
  id: ep-spmlx5-1786072758181058776
  name: Wanqing ep-spmlx5
  api: openai-completions
  # The OpenAI-compatible client appends /chat/completions to this base URL.
  baseUrl: https://wanqing-api.corp.kuaishou.com/api/gateway/v1/endpoints
  apiKeyEnv: WQ_API_KEY
  reasoning: true
  contextWindow: 1048576
  maxTokens: 16384

runtime:
  thinkingLevel: medium
  artifactRoot: .xuan-shu/runs
  scratchRoot: .xuan-shu/work
  maxTurns: 60
  maxToolCalls: 160
  maxRuntimeMs: 1200000
  # Effective budget leaves 20% headroom under the 60 RPM / 600K TPM gateway quota.
  modelMinIntervalMs: 7500
  modelRequestsPerMinute: 48
  modelTokensPerMinute: 480000
  modelMaxRetryDelayMs: 180000
  maxActionsWithoutCheckpoint: 6
  maxRepeatedAction: 3
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 8
  maxScratchFileBytes: 1048576
  finalizationReserveMs: 120000
  commandTimeoutMs: 30000
  httpTimeoutMs: 15000
  maxHttpRequests: 40
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: tcp://127.0.0.1:7320
    connectTimeoutMs: 2000

# Operator-owned scope for NSSCTF Agent Arena. Each challenge run narrows this
# wildcard to the exact host:port returned by the Arena control plane.
scope:
  mode: controlled
  workspaceRoot: ./workspace
  allowedHosts:
    - www.nssctf.cn
    - "*.nssctf.cn"
    - "*.nssctf.cn:*"
    # Local question instances narrow this wildcard to one exact loopback port per run.
    - "127.0.0.1:*"
  allowedPrograms:
    - 7z
    - apktool
    - base32
    - base64
    - bc
    - binwalk
    - bzip2
    - checksec
    - convert
    - dcfldd
    - ecm
    - exiftool
    - factor
    - ffmpeg
    - ffprobe
    - file
    - find
    - fls
    - flask-unsign
    - foremost
    - fsstat
    - g++
    - gcc
    - gdb
    - gifsicle
    - gp
    - gzip
    - hashcat
    - icat
    - identify
    - java
    - john
    - jq
    - make
    - minimodem
    - mmls
    - multimon-ng
    - nm
    - objdump
    - one_gadget
    - outguess
    - openssl
    - pickora
    - pngcheck
    - python3
    - qemu-aarch64
    - qemu-arm
    - qemu-i386
    - qemu-x86_64
    - qrencode
    - readelf
    - rg
    - ropper
    - ROPgadget
    - RsaCtfTool
    - r2
    - sage
    - seccomp-tools
    - sox
    - soxi
    - sqlite3
    - steghide
    - stegseek
    - stegsnow
    - strings
    - strace
    - tar
    - tesseract
    - testdisk
    - tshark
    - tsk_recover
    - unzip
    - vol
    - xfs_db
    - xfs_repair
    - xxd
    - xz
    - z3
    - zbarimg
    - zip
    - zsteg
    - cado-nfs
    - flatter
    - zstd

server:
  host: 127.0.0.1
  port: 7318
  tokenEnv: XUANSHU_SERVER_TOKEN

arena:
  enabled: true
  baseUrl: https://www.nssctf.cn
  tokenEnv: NSSCTF_AGENT_TOKEN
  timeoutMs: 30000
  maxResponseBytes: 262144
  # Focus the current Arena evaluation on Crypto and Misc only.
  allowedCategories:
    - crypto
    - misc
  maxCategorySkips: 10

questionBank:
  enabled: true
  rootEnv: XUANSHU_QUESTION_BANK_ROOT
  listFiles:
    - task_list_crypto.txt
    - task_list_misc.txt
  maxQuestions: 20
  # Each question runs three independent agents; the first verified completion cancels the rest.
  raceAgents: 3
  instanceRunner:
    enabled: true
    networkName: shared_net
    startupTimeoutMs: 300000
    commandTimeoutMs: 300000
    maxOutputBytes: 65536
