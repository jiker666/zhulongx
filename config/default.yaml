model:
  provider: openai
  id: gpt-5
  name: GPT-5
  api: openai-responses
  baseUrl: https://api.openai.com/v1
  apiKeyEnv: OPENAI_API_KEY
  reasoning: true
  contextWindow: 400000
  maxTokens: 8192

runtime:
  thinkingLevel: medium
  artifactRoot: .xuan-shu/runs
  scratchRoot: .xuan-shu/work
  maxTurns: 30
  maxToolCalls: 80
  maxRuntimeMs: 900000
  # Effective budget leaves 20% headroom under a 60 RPM / 600K TPM provider quota.
  modelMinIntervalMs: 7500
  modelRequestsPerMinute: 48
  modelTokensPerMinute: 480000
  maxActionsWithoutCheckpoint: 4
  maxRepeatedAction: 2
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 8
  maxScratchFileBytes: 1048576
  finalizationReserveMs: 90000
  commandTimeoutMs: 30000
  httpTimeoutMs: 15000
  maxHttpRequests: 40
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: tcp://127.0.0.1:7320
    connectTimeoutMs: 2000

scope:
  mode: observe
  workspaceRoot: ./workspace
  allowedHosts: []
  allowedPrograms:
    - 7z
    - apktool
    - base32
    - base64
    - bc
    - binwalk
    - bzip2
    - checksec
    - convert
    - dcfldd
    - ecm
    - exiftool
    - factor
    - dirsearch
    - ffmpeg
    - ffprobe
    - file
    - ffuf
    - find
    - fls
    - flask-unsign
    - foremost
    - fsstat
    - g++
    - gcc
    - gdb
    - gifsicle
    - gp
    - gzip
    - gobuster
    - hashcat
    - icat
    - identify
    - java
    - john
    - jq
    - make
    - minimodem
    - mmls
    - multimon-ng
    - nm
    - objdump
    - one_gadget
    - outguess
    - openssl
    - pickora
    - pngcheck
    - python3
    - qemu-aarch64
    - qemu-arm
    - qemu-i386
    - qemu-x86_64
    - qrencode
    - readelf
    - rg
    - ropper
    - ROPgadget
    - RsaCtfTool
    - r2
    - sage
    - seccomp-tools
    - sox
    - soxi
    - sqlite3
    - steghide
    - stegseek
    - stegsnow
    - strings
    - strace
    - tar
    - tesseract
    - testdisk
    - tshark
    - tsk_recover
    - unzip
    - vol
    - xfs_db
    - xfs_repair
    - xxd
    - xz
    - z3
    - zbarimg
    - zip
    - zsteg
    - cado-nfs
    - flatter
    - zstd

server:
  host: 127.0.0.1
  port: 7318
  tokenEnv: XUANSHU_SERVER_TOKEN

arena:
  enabled: true
  baseUrl: https://www.nssctf.cn
  tokenEnv: NSSCTF_AGENT_TOKEN
  timeoutMs: 15000
  maxResponseBytes: 262144
  allowedCategories:
    - crypto
    - misc
  maxCategorySkips: 10

questionBank:
  enabled: true
  # Set XUANSHU_QUESTION_BANK_ROOT to the local CyBench checkout.
  rootEnv: XUANSHU_QUESTION_BANK_ROOT
  listFiles:
    - task_list_crypto.txt
    - task_list_misc.txt
  maxQuestions: 20
