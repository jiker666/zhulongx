# NYU CTF Bench configuration for zhulongx
# Uses the local Wanqing model (same as tsec-wanqing.yaml)
#
# Prerequisites:
#   1. Clone nyu_ctf_bench: git clone https://github.com/nyu-llm-ctf/nyu_ctf_bench.git
#   2. Run adapter: python3 nyu-ctf/setup.py --bench-dir /path/to/nyu_ctf_bench --out-dir nyu-ctf/bench
#   3. Set env: NYU_CTF_BENCH_DIR=nyu-ctf/bench
#   4. Run: node dist/cli.js question-bank-solve --config config/nyu-ctf-wanqing.yaml

model:
  provider: wanqing-internal
  id: ep-spmlx5-1786072758181058776
  name: Wanqing ep-spmlx5
  api: openai-completions
  baseUrl: https://wanqing-api.corp.kuaishou.com/api/gateway/v1/endpoints
  apiKeyEnv: WQ_API_KEY
  reasoning: true
  contextWindow: 1048576
  maxTokens: 16384

runtime:
  thinkingLevel: low
  artifactRoot: .xuan-shu/nyu-runs
  scratchRoot: .xuan-shu/nyu-work
  maxTurns: 120
  maxToolCalls: 1500
  # 30 min per challenge — CTF bench problems are typically simpler than custom infra
  maxRuntimeMs: 1800000
  modelMinIntervalMs: 3000
  modelRequestsPerMinute: 60
  modelTokensPerMinute: 600000
  modelMaxRetryDelayMs: 300000
  maxActionsWithoutCheckpoint: 1000
  maxRepeatedAction: 1000
  policyPermissive: true
  maxOutputBytes: 65536
  maxImageBytes: 5242880
  maxImageObservations: 32
  maxScratchFileBytes: 2097152
  finalizationReserveMs: 15000
  commandTimeoutMs: 120000
  httpTimeoutMs: 15000
  maxHttpRequests: 2000
  maxTcpSessions: 32
  maxTcpBytes: 4194304
  sandbox:
    socketPath: tcp://127.0.0.1:7321
    connectTimeoutMs: 3000

scope:
  mode: controlled
  workspaceRoot: ./workspace
  allowedHosts:
    - localhost
    - localhost:*
    - 127.0.0.1
    - 127.0.0.1:*
    - 0.0.0.0:*
  allowedPrograms:
    - addr2line
    - base32
    - base64
    - bc
    - binwalk
    - bzip2
    - c++filt
    - checksec
    - convert
    - curl
    - dirsearch
    - exiftool
    - factor
    - ffuf
    - file
    - find
    - flask-unsign
    - foremost
    - g++
    - gap
    - gcc
    - gdb
    - gdb-multiarch
    - git
    - gobuster
    - gp
    - gzip
    - hashcat
    - httpx
    - jadx
    - java
    - john
    - jq
    - ltrace
    - make
    - nc
    - nm
    - nmap
    - objcopy
    - objdump
    - one_gadget
    - openssl
    - patchelf
    - php
    - pngcheck
    - pwn
    - python3
    - r2
    - rabin2
    - rafind2
    - ragg2
    - rax2
    - readelf
    - rg
    - ropper
    - ROPgadget
    - RsaCtfTool
    - sage
    - scalpel
    - seccomp-tools
    - sqlmap
    - ssh
    - steghide
    - stegseek
    - strings
    - strace
    - tar
    - tshark
    - unzip
    - vol
    - wget
    - xxd
    - xz
    - z3
    - zbarimg
    - zip
    - zsteg
    - zstd
  readOnlyPaths:
    - /Users/j1k3r/wordlists
    - /opt/homebrew/share/john
    - /etc
    - /usr/share
    - /opt/homebrew/share

profile:
  id: general-ctf
  preferredExecutor: sandbox
  approvalPolicy: never
  requiredCapabilities:
    - workspace-read
    - scratch-read
    - scratch-write
    - abort
  toolAllowlist:
    - submit_plan
    - checkpoint
    - record_finding
    - record_lesson
    - finish_task
    - list_files
    - read_file
    - inspect_artifact
    - extract_archive
    - search_artifact
    - observe_image
    - list_scratch_files
    - read_scratch_file
    - write_scratch_file
    - run_command
    - web_collect_baseline
    - web_knowledge_lookup
    - web_compare_responses
    - web_timing_stats
    - http_request
    - browser
    - tcp_open
    - tcp_send
    - tcp_receive
    - tcp_close
    - read_shared_evidence
    - publish_shared_evidence
  contextPolicy:
    compactAtRatio: 0.75
    keepRecentTokens: 100000
    maxSummaryChars: 12000

questionBank:
  enabled: true
  rootEnv: NYU_CTF_BENCH_DIR
  listFiles:
    - task_list_web.txt
    - task_list_pwn.txt
    - task_list_crypto.txt
    - task_list_rev.txt
    - task_list_forensics.txt
    - task_list_misc.txt
  # Set this to limit challenges per run (for testing)
  maxQuestions: 200

connectors: []

server:
  host: 127.0.0.1
  port: 7319
  tokenEnv: XUANSHU_SERVER_TOKEN
