model:
  provider: openai
  id: gpt-5
  name: GPT-5
  api: openai-responses
  baseUrl: https://api.openai.com/v1
  apiKeyEnv: OPENAI_API_KEY
  reasoning: true
  contextWindow: 400000
  maxTokens: 8192

runtime:
  thinkingLevel: medium
  artifactRoot: /data/runs
  scratchRoot: /workspace/work
  maxTurns: 60
  maxToolCalls: 160
  maxRuntimeMs: 1200000
  modelMinIntervalMs: 5000
  modelMaxRetryDelayMs: 180000
  maxActionsWithoutCheckpoint: 6
  maxRepeatedAction: 3
  maxOutputBytes: 65536
  maxScratchFileBytes: 1048576
  commandTimeoutMs: 30000
  httpTimeoutMs: 15000
  maxHttpRequests: 40
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: /run/xuanshu/ctf-sandbox.sock
    connectTimeoutMs: 2000

scope:
  mode: controlled
  workspaceRoot: /workspace/input
  allowedHosts:
    - www.nssctf.cn
    - "*.nssctf.cn"
    - "*.nssctf.cn:*"
  allowedPrograms:
    - 7z
    - apktool
    - base64
    - binwalk
    - bzip2
    - checksec
    - curl
    - dig
    - dirsearch
    - exiftool
    - ffmpeg
    - file
    - ffuf
    - find
    - fls
    - flask-unsign
    - foremost
    - gap
    - gdb
    - gzip
    - gobuster
    - hashcat
    - icat
    - java
    - john
    - jq
    - mmls
    - nmap
    - nm
    - objdump
    - one_gadget
    - patchelf
    - python3
    - qemu-aarch64
    - qemu-arm
    - qemu-i386
    - qemu-x86_64
    - qrencode
    - readelf
    - rg
    - ropper
    - ROPgadget
    - scalpel
    - seccomp-tools
    - sqlmap
    - sqlite3
    - strings
    - strace
    - tar
    - testdisk
    - tshark
    - unzip
    - whois
    - xxd
    - xz
    - zbarimg
    - zsteg
    - zstd
    - addr2line
    - c++filt
    - gdb-multiarch
    - jadx
    - ltrace
    - objcopy
    - pwn
    - r2
    - rabin2
    - rafind2
    - ragg2
    - rax2

server:
  host: 0.0.0.0
  port: 7318
  tokenEnv: XUANSHU_SERVER_TOKEN

arena:
  enabled: true
  baseUrl: https://www.nssctf.cn
  tokenEnv: NSSCTF_AGENT_TOKEN
  timeoutMs: 30000
  maxResponseBytes: 262144
