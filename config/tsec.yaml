model:
  provider: openai
  id: gpt5.5
  name: GPT-5.5 via relay
  api: openai-completions
  baseUrl: https://api.790053500.com/v1
  apiKeyEnv: OPENAI_API_KEY
  reasoning: true
  contextWindow: 400000
  maxTokens: 8192

runtime:
  thinkingLevel: low
  artifactRoot: .xuan-shu/runs
  scratchRoot: .xuan-shu/work
  maxTurns: 100
  maxToolCalls: 360
  maxRuntimeMs: 1200000
  modelMinIntervalMs: 1000
  modelMaxRetryDelayMs: 120000
  maxActionsWithoutCheckpoint: 8
  maxRepeatedAction: 2
  maxOutputBytes: 65536
  maxScratchFileBytes: 1048576
  commandTimeoutMs: 30000
  httpTimeoutMs: 15000
  maxHttpRequests: 250
  maxTcpSessions: 8
  maxTcpBytes: 1048576
  sandbox:
    socketPath: tcp://127.0.0.1:7320
    connectTimeoutMs: 3000

scope:
  mode: controlled
  workspaceRoot: ./workspace
  # Operator-owned TSec VPN range. The per-run scope is narrowed to the
  # exact address returned by the platform before the Agent receives it.
  allowedHosts:
    - 10.0.*.*
    - 10.0.*.*:*
  allowedPrograms:
    - base64
    - curl
    - dirsearch
    - ffuf
    - file
    - find
    - gap
    - gobuster
    - jq
    - patchelf
    - python3
    - rg
    - scalpel
    - unzip
    - xxd
    - addr2line
    - c++filt
    - gdb-multiarch
    - jadx
    - ltrace
    - objcopy
    - pwn
    - r2
    - rabin2
    - rafind2
    - ragg2
    - rax2

server:
  host: 127.0.0.1
  port: 7318
  tokenEnv: XUANSHU_SERVER_TOKEN

webReasoning:
  enabled: true
  autoDetectWebTasks: true
  persistState: true
  enableHypothesisManagement: true
  enableReflection: true
  enableActionDeduplication: true
  noEvidenceRoundLimit: 3
  duplicateActionLimit: 2
  toolFailureLimit: 3
  finalizationRoundReserve: 3
  maxObservations: 80
  maxHypotheses: 40
  maxActions: 320
  maxReflections: 12

browser:
  enabled: true
  headless: true
  maxSessionsPerRun: 1
  maxPagesPerSession: 2
  maxNavigationsPerRun: 12
  maxActionsPerRun: 50
  maxNetworkEventsPerRun: 500
  maxDomElementsPerSnapshot: 200
  maxDomSnapshotsPerRun: 40
  maxScreenshotsPerRun: 1
  maxResponseBodyBytes: 65536
  maxScriptBytes: 131072
  navigationTimeoutMs: 15000
  actionTimeoutMs: 10000
  sessionTimeoutMs: 900000
  blockDownloads: true
  blockUploads: true
  blockPopups: true
  blockExternalProtocols: true
