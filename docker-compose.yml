name: zhulong-xuanshu

services:
  xuanshu:
    build: .
    depends_on:
      ctf-sandbox:
        condition: service_healthy
    ports:
      - "127.0.0.1:${XUANSHU_PORT:-7318}:7318"
    environment:
      XUANSHU_MODEL_API_KEY: ${XUANSHU_MODEL_API_KEY:-}
      XUANSHU_SERVER_TOKEN: ${XUANSHU_SERVER_TOKEN:?set XUANSHU_SERVER_TOKEN}
      # The SDK CLI hard-fails a run when a single model response exceeds its
      # 32k-token output cap (observed: a pwn s1 turn dumping binary content
      # inline, run died at 16 turns). Raise the ceiling; env propagates to the
      # CLI through buildAgentSubprocessEnv's process.env spread.
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: "64000"
    volumes:
      - ./workspace:/workspace/input:ro
      - xuanshu-work:/workspace/work
      - xuanshu-sockets:/run/xuanshu
      - xuanshu-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7318/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5

  ctf-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.ctf-sandbox
      args:
        INSTALL_HEAVY: ${XUANSHU_INSTALL_HEAVY_CTF_TOOLS:-false}
    environment:
      # Sandbox commands can reach external networks (permissive mode);
      # isolation comes from the container boundary, not a dead network.
      XUANSHU_SANDBOX_NETWORK: external
    volumes:
      - ./workspace:/workspace/input:ro
      - xuanshu-work:/workspace/work
      - xuanshu-sockets:/run/xuanshu
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/cli.js", "sandbox-health", "--config", "config/container.yaml"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  xuanshu-data:
  xuanshu-work:
  xuanshu-sockets:
