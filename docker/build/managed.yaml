db_path: /work/managed.db
log_level: info

runtime:
  tick_interval: 2s
  decide_timeout: 15m
  execute_timeout: 35m
  max_concurrent_steps: 4
  max_steps_per_decide: 4
  step_max_attempts: 3
  decide_noop_limit: 5
  repair_timeout: 4m
  goal_step_budget: 6
  goal_wall_budget: 30m
  run_deadline: 350m
  endgame_after: 4h30m
  bootstrap_step: "Bootstrap direct attack: attempt to solve this challenge in ONE pass — read the brief and any existing attack ledger (attack/<题号>/work.md), recon, exploit, capture the flag, submit it, then report. Flag discipline: any flag candidate in hand is submitted THIS round, never deferred; on multi-flag challenges submit each flag the moment it lands, then keep hunting the remaining attack surfaces until the platform reports is_completed=true (correct_flag_count=flag_count) — one flag is not done. Partial progress is a valid finding too. Only if the challenge clearly needs staged work, sketch the decomposition in your report."

pi:
  command: pi
  args: []
  dir: /work
  spawn_retries: 3
