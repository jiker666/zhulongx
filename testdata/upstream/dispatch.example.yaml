# Cairn dispatcher example configuration.
# Copy to dispatch.yaml and fill in your own credentials. dispatch.yaml is gitignored.
server: "http://cairn-server:8000"

# Shared environment variables merged into every worker.
common_env: {}

runtime:
  interval: 3
  max_workers: 8
  max_running_projects: 3
  max_project_workers: 4
  healthcheck_timeout: 20
  worker_healthcheck: "startup_only"
  prompt_group: "default"

tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 2
  explore:
    timeout: 300
    conclude_timeout: 90

container:
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  network_mode: "host"
  completed_action: "stop"

workers:
  - name: "claudecode-worker"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      # Any Anthropic-compatible endpoint works, e.g. Zhipu GLM:
      #   ANTHROPIC_BASE_URL: "https://open.bigmodel.cn/api/anthropic"
      #   ANTHROPIC_MODEL: "glm-5.3"
      ANTHROPIC_MODEL: "your-model"
      ANTHROPIC_BASE_URL: "https://your-anthropic-compatible-endpoint"
      ANTHROPIC_AUTH_TOKEN: "your-api-token"
