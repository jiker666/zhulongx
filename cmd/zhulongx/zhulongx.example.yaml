# zhulongx configuration. Model/provider selection lives in your own pi
# configuration (PI_CODING_AGENT_DIR or defaults); zhulongx never overrides it.
db_path: zhulongx.db
log_level: info

runtime:
  tick_interval: 2s
  decide_timeout: 10m
  execute_timeout: 15m
  max_concurrent_steps: 2
  max_steps_per_decide: 3
  step_max_attempts: 3
  decide_noop_limit: 3

pi:
  command: pi
  args: []
  # dir: /path/to/working/directory   # optional agent cwd
  spawn_retries: 1
  # Tool policy: case-insensitive regex patterns. A bash command matching any
  # pattern aborts the run mid-flight (step fails permanently, no retry).
  # Empty/omitted = allow everything.
  # NOTE: patterns match the raw bash command string and cannot tell the
  # target — "shutdown|reboot" also kills legitimate remote host management
  # during cloud-range challenges (observed live on TSecBench: 4 permanent
  # step failures on one challenge). Keep only patterns that are never
  # legitimate on ANY target; drop host-management verbs when the agent
  # works a remote range.
  blocked_tools:
    - "rm\\s+-rf"
